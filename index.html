<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jefrin | Frontend Developer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b1120;
            color: #e5e7eb;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1100px, 90%);
            margin: auto;
        }

        /* NAVBAR */
        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(11, 17, 32, 0.95);
            border-bottom: 1px solid #1f2937;
            backdrop-filter: blur(10px);
        }

        .nav-content {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #38bdf8;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: #cbd5e1;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        /* HERO */
        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            background:
                radial-gradient(circle at top right, #123b5d 0, transparent 35%),
                radial-gradient(circle at bottom left, #172554 0, transparent 35%);
        }

        .hero-content {
            max-width: 750px;
        }

        .badge {
            display: inline-block;
            padding: 7px 15px;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            border-radius: 50px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .hero h1 {
            font-size: clamp(45px, 8vw, 82px);
            line-height: 1.05;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #38bdf8;
        }

        .hero p {
            color: #94a3b8;
            font-size: 20px;
            max-width: 650px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 13px 23px;
            border-radius: 8px;
            font-weight: bold;
            border: 1px solid #38bdf8;
            transition: 0.3s;
            cursor: pointer;
        }

        .btn-primary {
            background: #38bdf8;
            color: #0b1120;
        }

        .btn-primary:hover {
            background: #7dd3fc;
            transform: translateY(-3px);
        }

            color: #38bdf8;
        }
